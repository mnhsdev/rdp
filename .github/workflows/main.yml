name: Ubuntu

on:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Setup Ubuntu
        run: |
          sudo -i bash <<'ROOT'
          echo "===== Ubuntu ====="
          cat /etc/os-release
          echo "===== Current User ====="
          whoami
          echo "===== Kernel ====="
          uname -a
          ROOT

      - name: Create Matin user
        env:
          MATIN_PASSWORD: ${{ secrets.MATIN_PASSWORD }}
        run: |
          sudo -i bash <<ROOT
          useradd -m -s /bin/bash Matin 2>/dev/null || true
          echo "Matin:${MATIN_PASSWORD}" | chpasswd
          usermod -aG sudo Matin

          echo "Matin ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/Matin
          chmod 440 /etc/sudoers.d/Matin

          echo "===== USER ====="
          id Matin
          ROOT

      - name: Install SSH Server
        run: |
          sudo -i bash <<'ROOT'
          apt-get update
          apt-get install -y openssh-server curl

          mkdir -p /run/sshd

          sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sed -i 's/^#\?PermitRootLogin .*/PermitRootLogin yes/' /etc/ssh/sshd_config

          systemctl enable ssh
          systemctl restart ssh

          echo "===== SSH STATUS ====="
          systemctl --no-pager status ssh || true
          ROOT

      - name: Install Tailscale
        run: |
          sudo -i bash <<'ROOT'
          curl -fsSL https://tailscale.com/install.sh | sh
          ROOT

      - name: Start Tailscale
        run: |
          sudo -i bash <<'ROOT'
          mkdir -p /var/lib/tailscale

          tailscaled > /tmp/tailscaled.log 2>&1 &

          echo "Waiting for tailscaled..."

          for i in {1..30}; do
            if tailscale status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          echo "tailscaled started."
          ROOT

      - name: Login to Tailscale
        run: |
          sudo -i bash <<'ROOT'
          echo "========================================="
          echo " TAILSCALE LOGIN"
          echo "========================================="
          echo ""
          echo "The login URL will appear below."
          echo "Open it in your browser."
          echo ""
          echo "========================================="

          tailscale up --ssh
          ROOT

      - name: Connection information
        run: |
          sudo -i bash <<'ROOT'
          echo "========================================="
          echo " TAILSCALE CONNECTED"
          echo "========================================="

          tailscale status

          echo ""
          echo "Tailscale IPv4:"
          tailscale ip -4

          echo ""
          echo "SSH:"
          echo "ssh Matin@$(tailscale ip -4)"

          echo ""
          echo "========================================="
          echo " SERVER IS RUNNING"
          echo "========================================="
          ROOT

      - name: Keep alive
        run: |
          while true; do
            echo "[$(date)] Server is still running..."
            sleep 300
          done
